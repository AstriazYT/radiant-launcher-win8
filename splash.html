<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Radiant Survie</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0c0d12;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        .logo-box {
            text-align: center;
        }
        .logo-r {
            font-size: 96px;
            font-weight: 800;
            color: #ff3b56;
            text-shadow: 0 0 25px rgba(255, 59, 86, 0.5);
            line-height: 1;
            margin-bottom: 15px;
        }
        .title {
            font-size: 16px;
            letter-spacing: 4px;
            color: #8f92a1;
            text-transform: uppercase;
            font-weight: 600;
        }
        .loader-bar {
            width: 140px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            margin-top: 35px;
            position: relative;
            overflow: hidden;
            border-radius: 3px;
        }
        .loader-bar::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: #ff3b56;
            box-shadow: 0 0 10px #ff3b56;
            animation: loading 1.4s infinite ease-in-out;
        }
        @keyframes loading {
            0% { left: -50%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="logo-box">
        <div class="logo-r">R</div>
        <div class="title">RADIANT SURVIE</div>
        <div class="loader-bar"></div>
    </div>
</body>
</html>
